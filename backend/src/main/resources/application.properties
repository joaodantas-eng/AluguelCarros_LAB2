spring.application.name=aluguel-carros
server.port=8080

# Lê as variáveis do arquivo backend/.env (que NÃO vai para o GitHub)
spring.config.import=optional:file:.env[.properties]

# ===== Banco de dados (Supabase / PostgreSQL) =====
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# O plano gratuito do Supabase aceita poucas conexões ao mesmo tempo
spring.datasource.hikari.maximum-pool-size=5

# ===== JPA / Hibernate =====
# "update" cria/atualiza as tabelas automaticamente a partir das classes do model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
